<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Nothing here is public. A panel that is indexed is a panel whose URLs
         are known, and its sign-in page is then the only thing between a
         stranger and a list of what to try. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- The same mark as the site and the app, with the two brand colours
         swapped: a tab of the panel and a tab of flex.com.uz sit next to each
         other all day, and inverted is the fastest way to tell them apart.
         Written by landing/scripts/make-icons.mjs — the mark's geometry lives
         in one place. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <title>Flex — boshqaruv</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
