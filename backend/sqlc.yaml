# Turns the SQL in db/queries into typed Go.
#
# The direction matters. An ORM asks you to describe the data in Go and then
# writes SQL you did not read; sqlc asks you to write the SQL and then writes
# the Go you did not have to. This project already has two and a half thousand
# lines of hand-written SQL that does exactly what it means to, so the tool
# that keeps that as the source is the right one.
#
# It also type-checks against the real schema at generate time: a query naming
# a column that a migration removed fails `make sqlc`, not a request.
#
# Run: make sqlc
version: "2"
sql:
  - engine: "postgresql"
    # One source now. The product's whole schema is here — the forty-seven
    # migrations that built it on Supabase, the identity table and roles that
    # Supabase used to provide, and what this backend added afterwards — in the
    # order Postgres applies them. `make migrate` against an empty database
    # produces the shape these queries are checked against.
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        # A query returning one row gives back a struct, not a one-element
        # slice the caller has to unpack.
        emit_result_struct_pointers: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
