# Postgres and the backend, for development.
#
# The database is the reason this file exists: the backend itself runs faster
# from `go run`, with a rebuild on save, than it does through a container. So
# `make db` starts only Postgres and is what you want most days; `docker compose
# up` starts both and is how you check that the image actually works before it
# goes anywhere.

name: flex

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flex
      POSTGRES_PASSWORD: flex
      POSTGRES_DB: flex
    ports:
      # Published so psql, goose and `go run` on the host can reach it. The
      # bind is to localhost only — an unauthenticated Postgres on 0.0.0.0 is
      # found by scanners within the hour.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` answers before the server finishes starting, so the check
      # runs a query instead.
      test: ["CMD-SHELL", "psql -U flex -d flex -c 'select 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `db` is the service name, which is the hostname inside the compose
      # network — not the address the host uses.
      DATABASE_URL: postgres://flex:flex@db:5432/flex?sslmode=disable
      APP_ENV: development
      ADDR: ":8090"
    ports:
      - "127.0.0.1:8090:8090"

  # An S3 bucket on the laptop.
  #
  # The images live in Cloudflare R2 in production. This is the same API, so
  # the code that talks to one talks to the other and nobody needs a cloud
  # credential to change an avatar while working. `make minio` starts it
  # alongside Postgres; the console is on :9001, user and password `flexflex`.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flexflex
      MINIO_ROOT_PASSWORD: flexflex
    ports:
      # Localhost only, like Postgres. An object store on 0.0.0.0 with a
      # password this guessable is a public folder.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Makes the bucket once and exits. Without it the first upload fails against
  # a store that is running and empty, which reads like a permission problem.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 flexflex flexflex &&
      mc mb --ignore-existing local/flex-images &&
      mc anonymous set download local/flex-images
      "

volumes:
  db-data:
  minio-data:
