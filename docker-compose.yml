services:
  postgres:
    image: postgres:16-alpine
    container_name: mynt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mynt
      POSTGRES_PASSWORD: mynt
      POSTGRES_DB: mynt
    ports:
      - "5434:5432"
    volumes:
      - mynt_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  mynt_pgdata:
