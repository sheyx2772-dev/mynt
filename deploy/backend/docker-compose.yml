# The API and the database it owns.
#
# They live together because nothing else may touch that database: every rule
# about the data is written once, in Go, and the website, the phone and the
# panel all ask across the network rather than reaching past it.

name: flex-backend

services:
  app:
    image: ghcr.io/zoir-dev/flex-api:${TAG:-latest}
    restart: always
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://flex:${POSTGRES_PASSWORD}@db:5432/flex?sslmode=disable
      ADDR: ":8090"
      # Behind a proxy, so the forwarded address is the visitor's and can be
      # believed. Without this every rate limit counts one client: Traefik.
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    networks: [web, default]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flex-api.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.flex-api.entrypoints=websecure"
      - "traefik.http.routers.flex-api.tls.certresolver=le"
      - "traefik.http.services.flex-api.loadbalancer.server.port=8090"

      # TEMPORARY. Delete this router the moment APP_ENV is `production`.
      #
      # `POST /v1/kirish/telefon` answers with the login code itself when the
      # build is development and no SMS sender is configured. That is right on
      # a laptop and a full authentication bypass on the internet: ask for a
      # code against somebody's number, read it out of the reply, sign in as
      # them. The code says a production build cannot reach that line — and it
      # cannot; this deployment is simply not one yet, because APP_ENV is
      # `development` so that it can boot without Resend and Eskiz keys.
      #
      # So the door is shut where it is reachable rather than where it is
      # written. It lives here and not on the server because the next deploy
      # copies this file over whatever is there, and a stopgap that disappears
      # without anybody noticing is worse than no stopgap.
      - "traefik.http.routers.flex-api-kod.rule=Host(`${DOMAIN_NAME}`) && Path(`/v1/kirish/telefon`)"
      - "traefik.http.routers.flex-api-kod.priority=100"
      - "traefik.http.routers.flex-api-kod.entrypoints=websecure"
      - "traefik.http.routers.flex-api-kod.tls.certresolver=le"
      - "traefik.http.routers.flex-api-kod.service=flex-api"
      - "traefik.http.routers.flex-api-kod.middlewares=faqat-mahalliy"
      - "traefik.http.middlewares.faqat-mahalliy.ipallowlist.sourcerange=127.0.0.1/32"

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: flex
      POSTGRES_DB: flex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
    volumes:
      - db:/var/lib/postgresql/data
    # No labels and no ports: unreachable from outside this compose network,
    # which is the whole reason it needs no password policy of its own.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flex -d flex"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [default]

volumes:
  db:

networks:
  web:
    external: true
