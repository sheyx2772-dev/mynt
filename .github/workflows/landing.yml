name: landing

on:
  push:
    branches: [main]
    paths: ['landing/**', '.github/workflows/landing.yml']
  pull_request:
    paths: ['landing/**']

concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src --quiet
      - run: npx vitest run

  ship:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: landing
          push: true
          # NEXT_PUBLIC_ values are read at build time and baked into the code
          # the browser downloads, so they belong here rather than in the
          # container's environment. They are public by definition — the
          # browser gets them either way — which is why they are variables and
          # not secrets.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_TELEGRAM_BOT_NAME=${{ vars.NEXT_PUBLIC_TELEGRAM_BOT_NAME }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/flex-web:latest
            ghcr.io/${{ github.repository_owner }}/flex-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GH_ACTOR
          script: |
            set -e
            cd /opt/flex
            git fetch --depth 1 origin main && git reset --hard origin/main
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker compose -f deploy/compose.yml --env-file .env pull web
            # The whole stack, not just this service. Compose recreates only
            # what changed, and `up -d web` alone would never start Caddy —
            # nothing depends on it, so nothing brings it up.
            docker compose -f deploy/compose.yml --env-file .env up -d
            docker logout ghcr.io
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
