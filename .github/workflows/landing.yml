name: landing

on:
  push:
    branches: [main]
    paths: ['landing/**', 'deploy/landing/**', '.github/workflows/landing.yml']
  pull_request:
    paths: ['landing/**']

concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      # Next generates the route types — PageProps and friends — during a
      # build, and they are not committed. Without this, tsc on a clean
      # checkout fails on every page in the app for a reason that looks
      # nothing like the cause.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src --quiet
      - run: npx vitest run

  ship:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: landing
          push: true
          # NEXT_PUBLIC_ values are read at build time and baked into the code
          # the browser downloads, so they belong here rather than in the
          # container's environment. They are public by definition — the
          # browser gets them either way — which is why they are variables and
          # not secrets.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_TELEGRAM_BOT_NAME=${{ vars.NEXT_PUBLIC_TELEGRAM_BOT_NAME }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/flex-web:latest
            ghcr.io/${{ github.repository_owner }}/flex-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The compose file is the only thing the server needs from the
      # repository, so it is copied rather than cloned. No git, no source and
      # no build toolchain on a machine that faces the internet.
      - name: send the compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/landing/docker-compose.yml
          target: ~/landing
          strip_components: 2

      - name: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # The registry token is passed in for this one command and is gone
          # when the shell exits. A password left in the server's docker config
          # is a password that leaves with the machine.
          envs: GHCR_TOKEN,GH_ACTOR
          script: |
            set -e
            cd ~/landing
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker compose pull
            docker compose up -d
            docker logout ghcr.io
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
