# The Go backend: test it, build an image, put it on the server.
#
# Path-filtered, so a change to the site does not rebuild this. That is the
# whole reason the four applications can live in one repository without
# spending four times the minutes.

name: backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'deploy/backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**']

# One deploy at a time. Two overlapping runs would race to swap the same
# container, and the loser wins.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test ./...

  ship:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To push the image, and to hand the server a short-lived token to pull
      # it with. Nothing long-lived is stored on the machine.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # Both tags every time: `latest` is what the server pulls, the sha is
          # what a rollback points at.
          tags: |
            ghcr.io/${{ github.repository_owner }}/flex-api:latest
            ghcr.io/${{ github.repository_owner }}/flex-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The compose file is the only thing the server needs from the
      # repository, so it is copied rather than cloned. No git, no source and
      # no build toolchain on a machine that faces the internet.
      - name: send the compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/backend/docker-compose.yml
          target: ~/backend
          strip_components: 2

      - name: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # The registry token is passed in for this one command and is gone
          # when the shell exits. A password left in the server's docker config
          # is a password that leaves with the machine.
          envs: GHCR_TOKEN,GH_ACTOR
          script: |
            set -e
            cd ~/backend
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker compose pull
            docker compose up -d
            docker logout ghcr.io
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
